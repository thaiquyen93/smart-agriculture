version: '3.8'

services:
  redpanda-test:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: test-redpanda-storage
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda-test:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
    volumes:
      # BIND MOUNT: Thư mục ./storage trên máy bạn sẽ ánh xạ trực tiếp vào container!
      - ./storage:/var/lib/redpanda/data
